# Per-commit sanity: type-check the frontend, vet + test the Go side, and
# prove the whole thing still cross-compiles CGO-free for windows/amd64.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend type-check + build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Go vet + test
        run: |
          go vet ./...
          go test ./...
      - name: Cross-compile for windows/amd64 (CGO off)
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go build -o /dev/null .
